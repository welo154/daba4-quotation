<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Studio</title><link rel="stylesheet" href="/invoices/style.css"></head><body><aside><h2>◈ Invoice Studio</h2><small>YOUR WORK. BEAUTIFULLY BILLED.</small><button onclick="view('editor')">↗ Create invoice</button><button onclick="view('history');list()">◷ Invoice history</button><a class="switch" href="/">▤ Quotation studio</a><p id="connection">Connecting…</p></aside><main><header><div><small>WORKSPACE / INVOICES</small><h1>Invoice workspace</h1></div><div><button onclick="fresh()">New invoice</button><button class="primary" id="save" onclick="save()">Save invoice</button><button onclick="download()">↓ PDF</button></div></header><p id="notice" role="status">Loading…</p><section id="editor"><div class="form"><div class="card"><h2>Invoice details</h2><label>Date<input id="date" type="date"></label><label>Currency<select id="currency"><option>EGP</option><option>USD</option><option>EUR</option><option>AED</option><option>SAR</option></select></label></div><div class="card"><h2>Billed to</h2><label>Brand / client<input id="client"></label><label>Contact details<textarea id="clientInfo"></textarea></label><label>Client logo<input type="file" accept="image/png,image/jpeg,image/webp" onchange="upload(this)"></label><button onclick="logo='';render()">Remove logo</button></div><div class="card"><h2>From</h2><label>Name / studio<input id="sender"></label><label>Contact details<textarea id="senderInfo"></textarea></label></div><div class="card"><h2>Line items</h2><div id="items"></div><button onclick="items.push({description:'',quantity:1,price:0});itemForm();render()">＋ Add item</button></div><div class="card"><h2>Payment & notes</h2><label>Invoice type<select id="paymentMode"><option value="deposit" selected>Deposit invoice</option><option value="balance">Main invoice</option></select></label><label>Paid deposit<input id="deposit" type="number" min="0" step=".01"></label><label>Payment method<input id="payment"></label><label>Note<textarea id="note"></textarea></label></div></div><div class="preview"><small>LIVE PREVIEW <span>A4 · Portrait</span></small><article id="paper"></article></div></section><section id="history" hidden><div class="card"><h2>Invoice archive</h2><input id="search" placeholder="Search client or number" oninput="paintList()"><div id="records"></div></div><div id="revisions" class="card" hidden></div></section></main><script src="/config.js"></script><script src="/supabase-client.js"></script><script src="/invoices/app.js"></script></body></html>
