<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wahaj Studio · Supabase setup</title>
  <style>
    body{margin:0;font:14px system-ui,sans-serif;background:#f4f4f5;color:#18181b}
    main{max-width:820px;margin:40px auto;padding:0 20px}
    .card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:22px;margin-bottom:16px}
    h1{font-size:22px;margin:0 0 8px} p{color:#52525b;line-height:1.55}
    a,button{font:inherit} button{cursor:pointer;padding:10px 14px;border-radius:6px;border:1px solid #d4d4d8;background:#18181b;color:#fff;font-weight:600}
    button.secondary{background:#fff;color:#18181b}
    pre{background:#f4f4f5;border:1px solid #e4e4e7;border-radius:8px;padding:14px;overflow:auto;max-height:360px;font-size:12px}
    #status{padding:12px 14px;border-radius:8px;background:#eef2ff;margin-top:12px}
    #status.ok{background:#ecfdf5} #status.bad{background:#fef2f2}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Connect Supabase tables</h1>
    <p>The app is pointed at your project. Run the shared schema once in the Supabase SQL Editor, then click Check.</p>
    <div class="row">
      <a href="https://supabase.com/dashboard/project/rpectddtwbnxroyplaiv/sql/new" target="_blank" rel="noopener">
        <button type="button">Open SQL Editor</button>
      </a>
      <button type="button" class="secondary" id="copy">Copy schema.sql</button>
      <button type="button" class="secondary" id="check">Check connection</button>
      <a href="/"><button type="button" class="secondary">Quotations</button></a>
      <a href="/invoices/"><button type="button" class="secondary">Invoices</button></a>
    </div>
    <div id="status">Checking…</div>
  </div>
  <div class="card">
    <h2 style="margin:0 0 10px;font-size:16px">schema.sql</h2>
    <pre id="sql">Loading…</pre>
  </div>
</main>
<script src="/config.js"></script>
<script>
async function loadSql(){
  const r=await fetch('/supabase/schema.sql');
  const t=await r.text();
  document.getElementById('sql').textContent=t;
  return t;
}
async function check(){
  const el=document.getElementById('status');
  const cfg=window.WAHAJ_SUPABASE||{};
  try{
    const base=String(cfg.url||'').replace(/\/$/,'');
    const headers={apikey:cfg.key,Authorization:'Bearer '+cfg.key};
    const inv=await fetch(base+'/rest/v1/invoices?select=id&limit=1',{headers});
    const quo=await fetch(base+'/rest/v1/quotations?select=id&limit=1',{headers});
    const it=await inv.text(); const qt=await quo.text();
    if(inv.ok&&quo.ok){
      el.className='ok';
      el.textContent='Connected. invoices and quotations tables are ready. You can save from both studios.';
    }else{
      el.className='bad';
      el.textContent='Not ready yet. Open the SQL Editor, paste schema.sql, click Run, then Check again. Details: '+(it||qt).slice(0,220);
    }
  }catch(e){
    el.className='bad';
    el.textContent=e.message;
  }
}
let sqlText='';
loadSql().then(t=>{sqlText=t; check();});
document.getElementById('check').onclick=check;
document.getElementById('copy').onclick=async()=>{
  if(!sqlText)sqlText=await loadSql();
  await navigator.clipboard.writeText(sqlText);
  document.getElementById('status').textContent='Schema copied. Paste it in the SQL Editor and click Run.';
};
</script>
</body>
</html>
